# 12-factor configuration shared across all services.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "acm.fullname" . }}-config
  labels:
    {{- include "acm.labels" . | nindent 4 }}
data:
  STORAGE_PROVIDER: {{ .Values.config.storageProvider | quote }}
  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  DB_URL: {{ .Values.config.dbUrl | quote }}
  AI_DB_URL: {{ .Values.config.aiDbUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
