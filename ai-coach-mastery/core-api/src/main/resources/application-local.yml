# =============================================================================
# 'local' profile — Docker-free fallback (start-local.sh / start-local.ps1).
# H2 file database in PostgreSQL compatibility mode; Hibernate creates the
# schema (Flyway off); DataSeeder populates the 4-client showcase on first run.
# =============================================================================
spring:
  datasource:
    url: jdbc:h2:file:./.localdb/aicoach;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS core
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: core
  flyway:
    enabled: false

app:
  ai-engine-url: ${AI_ENGINE_URL:http://localhost:8000}
  seed-demo-data: true
