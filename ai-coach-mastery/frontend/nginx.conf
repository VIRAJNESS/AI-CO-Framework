# Production nginx config for the Angular SPA.
# API routing is delegated to the platform ingress in cloud deployments;
# locations below cover the same proxy contract for container-only setups.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend proxies (service names resolve on the compose/K8s network)
    location /api/core/ {
        proxy_pass http://core-api:8080/api/v1/;
    }
    location /api/ai/ {
        proxy_pass http://ai-engine:8000/api/v1/;
    }
    location /health/core {
        proxy_pass http://core-api:8080/actuator/health;
    }
    location /health/ai {
        proxy_pass http://ai-engine:8000/health;
    }

    # Static asset caching
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
